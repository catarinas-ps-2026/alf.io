name: Test Push

on:
    push:
        branches:
            - main
        paths:
            - "src/**"
            - "frontend/**"
            - "gradle/**"
            - "*.gradle"
            - "gradle.properties"
            - "gradlew"
            - "docker-compose.yml"
            - ".github/workflows/**"

permissions:
    contents: write

jobs:
    backend-tests:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                postgresql: ["10", "15", "16"]
        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: 17
                  distribution: temurin

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Run Backend Tests
              run: ./gradlew test jacocoTestReport -Dpgsql.version=${{ matrix.postgresql }}

            - name: Upload Jacoco Coverage
              if: matrix.postgresql == '16'
              uses: actions/upload-artifact@v4
              with:
                  name: backend-coverage
                  path: build/reports/jacoco/test/html/
                  retention-days: 1

    checkstyle:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: 17
                  distribution: temurin

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Run Checkstyle
              run: ./gradlew checkstyleMain checkstyleTest

            - name: Upload Checkstyle Report Artifact
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: checkstyle-report
                  path: build/reports/checkstyle/
                  if-no-files-found: ignore
                  retention-days: 1

    frontend-tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v3
              with:
                  version: 11.1.2

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "pnpm"
                  cache-dependency-path: frontend/pnpm-lock.yaml

            - name: Run Frontend Tests
              run: |
                  pnpm --prefix frontend install
                  pnpm --prefix frontend run coverage

            - name: Upload Frontend Admin Coverage
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-admin-coverage
                  path: frontend/admin/coverage/
                  retention-days: 1

            - name: Upload Frontend Public Coverage
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-public-coverage
                  path: frontend/projects/public/coverage/
                  retention-days: 1

    e2e-tests:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: alfio
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: 17
                  distribution: temurin

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - uses: pnpm/action-setup@v3
              with:
                  version: 11.1.2

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "pnpm"
                  cache-dependency-path: src/test/e2e/pnpm-lock.yaml

            - name: Cache Playwright browsers
              uses: actions/cache@v4
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('src/test/e2e/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-playwright-

            - name: Install E2E dependencies
              run: pnpm --prefix src/test/e2e install

            - name: Install Playwright Browsers
              run: pnpm --prefix src/test/e2e exec playwright install --with-deps

            - name: Run Playwright E2E Tests
              env:
                  E2E_SERVER_APIKEY: e2e-test-api-key
                  ALFIO_OVERRIDE_SYSTEM_SETTINGS_SYSTEM_API_KEY: e2e-test-api-key
                  ALFIO_OVERRIDE_SYSTEM_SETTINGS_BASE_URL: http://localhost:8080
              run: pnpm --prefix src/test/e2e test

            - name: Upload Playwright Report Artifact
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: playwright-report
                  path: src/test/e2e/playwright-report/
                  if-no-files-found: ignore
                  retention-days: 1

    performance-test:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: alfio
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: 17
                  distribution: temurin

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - uses: pnpm/action-setup@v3
              with:
                  version: 11.1.2

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "pnpm"
                  cache-dependency-path: frontend/pnpm-lock.yaml

            - name: Build Frontend and Backend
              run: |
                  pnpm --prefix frontend install
                  ./gradlew bootJar

            - name: Start alf.io App
              run: |
                  ALFIO_OVERRIDE_SYSTEM_SETTINGS_SYSTEM_API_KEY="my-performance-test-api-key" \
                  java -Ddatasource.url="jdbc:postgresql://localhost:5432/alfio" \
                       -Ddatasource.username="postgres" \
                       -Ddatasource.password="password" \
                       -Dspring.profiles.active=dev \
                       -jar build/libs/alfio-*-boot.jar > app.log 2>&1 &
                  echo "APP_PID=$!" >> $GITHUB_ENV

            - name: Wait for alf.io to start
              run: |
                  MAX_ATTEMPTS=60
                  ATTEMPT=0
                  while true; do
                      if curl --output /dev/null --silent --fail "http://localhost:8080/healthz"; then
                          echo "alf.io is healthy!"
                          break
                      fi
                      ATTEMPT=$((ATTEMPT + 1))
                      if [ ${ATTEMPT} -eq ${MAX_ATTEMPTS} ]; then
                          echo "Error: Timeout waiting for alf.io to start."
                          cat app.log
                          exit 1
                      fi
                      sleep 1
                  done

            - name: Setup k6
              uses: grafana/setup-k6-action@v1

            - name: Run k6 performance test
              uses: grafana/run-k6-action@v1
              with:
                  path: src/test/k6/performance-test.js
                  flags: --env BASE_URL=http://localhost:8080 --env API_KEY=my-performance-test-api-key

            - name: Stop alf.io App
              if: always()
              run: |
                  if [ -n "${{ env.APP_PID }}" ]; then
                      kill "${{ env.APP_PID }}" || true
                  fi

            - name: Upload k6 Report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: k6-report
                  path: k6-report.html
                  retention-days: 1

    deploy-coverage:
        needs:
            [
                backend-tests,
                checkstyle,
                frontend-tests,
                e2e-tests,
                performance-test,
            ]
        runs-on: ubuntu-latest
        steps:
            - name: Prepare Workspace
              run: |
                  mkdir -p public-coverage
                  mkdir -p public-coverage/backend
                  mkdir -p public-coverage/frontend-admin
                  mkdir -p public-coverage/frontend-public
                  mkdir -p public-coverage/checkstyle
                  mkdir -p public-coverage/playwright
                  mkdir -p public-coverage/k6

            - name: Download Backend Coverage
              uses: actions/download-artifact@v4
              with:
                  name: backend-coverage
                  path: public-coverage/backend

            - name: Download Frontend Admin Coverage
              uses: actions/download-artifact@v4
              with:
                  name: frontend-admin-coverage
                  path: public-coverage/frontend-admin

            - name: Download Frontend Public Coverage
              uses: actions/download-artifact@v4
              with:
                  name: frontend-public-coverage
                  path: public-coverage/frontend-public

            - name: Download Checkstyle Report
              uses: actions/download-artifact@v4
              with:
                  name: checkstyle-report
                  path: public-coverage/checkstyle
              continue-on-error: true

            - name: Download Playwright Report
              uses: actions/download-artifact@v4
              with:
                  name: playwright-report
                  path: public-coverage/playwright
              continue-on-error: true

            - name: Download k6 Report
              uses: actions/download-artifact@v4
              with:
                  name: k6-report
                  path: public-coverage/k6
              continue-on-error: true

            - name: Generate Coverage Index HTML
              run: |
                  cat <<EOF > public-coverage/index.html
                  <!DOCTYPE html>
                  <html>
                  <head><title>Coverage & Checkstyle Reports - main branch</title></head>
                  <body>
                  <h1>Coverage & Checkstyle Reports - main branch</h1>
                  <ul>
                  <li><a href="backend/index.html">Backend (Jacoco)</a></li>
                  <li><a href="frontend-admin/index.html">Frontend Admin</a></li>
                  <li><a href="frontend-public/index.html">Frontend Public</a></li>
                  <li><a href="playwright/index.html">Playwright E2E Tests</a></li>
                  <li><a href="k6/k6-report.html">k6 Performance Test Report</a></li>
                  <li>Checkstyle Reports:
                    <ul>
                      <li><a href="checkstyle/main.html">Main Sources</a></li>
                      <li><a href="checkstyle/test.html">Test Sources</a></li>
                    </ul>
                  </li>
                  </ul>
                  </body>
                  </html>
                  EOF

            - name: Deploy Coverage to GitHub Pages
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./public-coverage
                  keep_files: true
