name: Test PR

on:
    pull_request:
        types: [opened, synchronize, reopened]
        paths:
            - "src/**"
            - "frontend/**"
            - "gradle/**"
            - "*.gradle"
            - "gradle.properties"
            - "gradlew"
            - "docker-compose.yml"
            - ".github/workflows/**"

permissions:
    pull-requests: write
    contents: write

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.event.pull_request.head.ref }}

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: 17
                  distribution: temurin
                  cache: gradle

            - uses: pnpm/action-setup@v3
              with:
                  version: 11.1.2

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "pnpm"
                  cache-dependency-path: frontend/pnpm-lock.yaml

            - name: Format Code (Java & Frontend)
              run: |
                pnpm --prefix frontend install
                pnpm --prefix frontend run format
                ./gradlew spotlessApply

            - name: Commit and Push formatting changes
              run: |
                git config --global user.name "github-actions[bot]"
                git config --global user.email "github-actions[bot]@users.noreply.github.com"
                if ! git diff --exit-code; then
                  git commit -am "chore: auto-format code"
                  git push
                  echo "Formatting changes pushed. Exiting current run."
                  exit 1
                fi

            - name: Run Backend Tests
              run: ./gradlew test jacocoTestReport -Dpgsql.version=16

            - name: Run Checkstyle
              run: ./gradlew checkstyleMain checkstyleTest

            - name: Upload Checkstyle Report Artifact
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: checkstyle-report
                  path: build/reports/checkstyle/
                  if-no-files-found: ignore

            - name: Run Frontend Tests
              run: |
                  pnpm --prefix frontend install
                  pnpm --prefix frontend run coverage

            - name: Prepare Coverage for Deployment
              run: |
                  mkdir -p public-coverage
                  mkdir -p public-coverage/backend
                  mkdir -p public-coverage/frontend-admin
                  mkdir -p public-coverage/frontend-public
                  mkdir -p public-coverage/checkstyle
                  cp -r build/reports/jacoco/test/html/* public-coverage/backend/
                  cp -r frontend/admin/coverage/* public-coverage/frontend-admin/
                  cp -r frontend/projects/public/coverage/* public-coverage/frontend-public/
                  cp -r build/reports/checkstyle/* public-coverage/checkstyle/ || true
                  cat <<EOF > public-coverage/index.html
                  <!DOCTYPE html>
                  <html>
                  <head><title>Coverage & Checkstyle Reports - PR #${{ github.event.number }}</title></head>
                  <body>
                  <h1>Coverage & Checkstyle Reports - PR #${{ github.event.number }}</h1>
                  <ul>
                  <li><a href="backend/index.html">Backend (Jacoco)</a></li>
                  <li><a href="frontend-admin/index.html">Frontend Admin</a></li>
                  <li><a href="frontend-public/index.html">Frontend Public</a></li>
                  <li><a href="playwright/index.html">Playwright E2E Tests</a></li>
                  <li>Checkstyle Reports:
                    <ul>
                      <li><a href="checkstyle/main.html">Main Sources</a></li>
                      <li><a href="checkstyle/test.html">Test Sources</a></li>
                    </ul>
                  </li>
                  </ul>
                  </body>
                  </html>
                  EOF

            - name: Deploy PR Coverage to GitHub Pages
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./public-coverage
                  destination_dir: pr-${{ github.event.number }}
                  keep_files: true

            - name: Comment on PR
              uses: actions/github-script@v7
              with:
                  script: |
                      const repo = context.repo.repo;
                      const owner = context.repo.owner;
                      const prNumber = context.issue.number;
                      const link = `https://${owner}.github.io/${repo}/pr-${prNumber}/`;
                      github.rest.issues.createComment({
                        issue_number: prNumber,
                        owner: owner,
                        repo: repo,
                        body: `Se completó la generación del reporte de cobertura.\n\nEspera 1-2 minutos y revisa los [Reportes de Cobertura](${link})`
                      })

    e2e-test:
        needs: test
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: alfio
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - uses: actions/checkout@v4
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.event.pull_request.head.ref }}

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: 17
                  distribution: temurin
                  cache: gradle

            - uses: pnpm/action-setup@v3
              with:
                  version: 11.1.2

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "pnpm"
                  cache-dependency-path: src/test/e2e/pnpm-lock.yaml

            - name: Install E2E dependencies
              run: pnpm --prefix src/test/e2e install

            - name: Install Playwright Browsers
              run: pnpm --prefix src/test/e2e exec playwright install --with-deps

            - name: Run Playwright E2E Tests
              env:
                  E2E_SERVER_APIKEY: e2e-test-api-key
                  ALFIO_OVERRIDE_SYSTEM_SETTINGS_SYSTEM_API_KEY: e2e-test-api-key
              run: pnpm --prefix src/test/e2e test

            - name: Upload Playwright Report Artifact
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: playwright-report
                  path: src/test/e2e/playwright-report/
                  if-no-files-found: ignore

            - name: Deploy Playwright Report to GitHub Pages
              uses: peaceiris/actions-gh-pages@v4
              if: always()
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: src/test/e2e/playwright-report/
                  destination_dir: pr-${{ github.event.number }}/playwright
                  keep_files: true
