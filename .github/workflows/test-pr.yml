name: Test PR

on:
    pull_request:
        types: [opened, synchronize, reopened]
        paths:
            - "src/**"
            - "frontend/**"
            - "gradle/**"
            - "*.gradle"
            - "gradle.properties"
            - "gradlew"
            - "docker-compose.yml"
            - ".github/workflows/**"

permissions:
    pull-requests: write
    contents: write

jobs:
    format:
        runs-on: ubuntu-latest
        outputs:
            changed: ${{ steps.check_changes.outputs.changed }}
        steps:
            - uses: actions/checkout@v4
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.event.pull_request.head.ref }}

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: 17
                  distribution: temurin

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - uses: pnpm/action-setup@v3
              with:
                  version: 11.1.2

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "pnpm"
                  cache-dependency-path: frontend/pnpm-lock.yaml

            - name: Format Code (Java & Frontend)
              run: |
                  pnpm --prefix frontend install
                  pnpm --prefix frontend run format
                  ./gradlew spotlessApply

            - name: Commit and Push formatting changes
              id: check_changes
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  if ! git diff --exit-code; then
                    git commit -am "chore: auto-format code"
                    git push
                    echo "Formatting changes pushed. Exiting current run."
                    echo "changed=true" >> $GITHUB_OUTPUT
                  else
                    echo "changed=false" >> $GITHUB_OUTPUT
                  fi

    backend-tests:
        needs: format
        if: needs.format.outputs.changed != 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.event.pull_request.head.ref }}

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: 17
                  distribution: temurin

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Run Backend Tests
              run: ./gradlew test integrationTest jacocoTestReport -Dpgsql.version=16

            - name: Upload Jacoco Coverage
              uses: actions/upload-artifact@v4
              with:
                  name: backend-coverage
                  path: build/reports/jacoco/test/html/
                  retention-days: 1

            - name: Upload JUnit Integration Test Report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: integration-test-report
                  path: build/reports/tests/integrationTest/
                  retention-days: 1

            - name: Upload OpenAPI Contract Report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: openapi-contract-report
                  path: build/api-docs/
                  retention-days: 1

    checkstyle:
        needs: format
        if: needs.format.outputs.changed != 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.event.pull_request.head.ref }}

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: 17
                  distribution: temurin

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Run Checkstyle
              run: ./gradlew checkstyleMain checkstyleTest

            - name: Upload Checkstyle Report Artifact
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: checkstyle-report
                  path: build/reports/checkstyle/
                  if-no-files-found: ignore
                  retention-days: 1

    frontend-tests:
        needs: format
        if: needs.format.outputs.changed != 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.event.pull_request.head.ref }}

            - uses: pnpm/action-setup@v3
              with:
                  version: 11.1.2

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "pnpm"
                  cache-dependency-path: frontend/pnpm-lock.yaml

            - name: Run Frontend Tests
              run: |
                  pnpm --prefix frontend install
                  pnpm --prefix frontend run coverage

            - name: Upload Frontend Admin Coverage
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-admin-coverage
                  path: frontend/admin/coverage/
                  retention-days: 1

            - name: Upload Frontend Public Coverage
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-public-coverage
                  path: frontend/projects/public/coverage/
                  retention-days: 1

    e2e-tests:
        needs: format
        if: needs.format.outputs.changed != 'true'
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: alfio
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@v4
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.event.pull_request.head.ref }}

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: 17
                  distribution: temurin

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - uses: pnpm/action-setup@v3
              with:
                  version: 11.1.2

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "pnpm"
                  cache-dependency-path: src/test/e2e/pnpm-lock.yaml

            - name: Cache Playwright browsers
              uses: actions/cache@v4
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('src/test/e2e/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-playwright-

            - name: Install E2E dependencies
              run: pnpm --prefix src/test/e2e install

            - name: Install Playwright Browsers
              run: pnpm --prefix src/test/e2e exec playwright install --with-deps

            - name: Run Playwright E2E Tests
              env:
                  E2E_SERVER_APIKEY: e2e-test-api-key
                  ALFIO_OVERRIDE_SYSTEM_SETTINGS_SYSTEM_API_KEY: e2e-test-api-key
                  ALFIO_OVERRIDE_SYSTEM_SETTINGS_BASE_URL: http://localhost:8080
                  E2E_ADMIN_USERNAME: admin
                  E2E_ADMIN_PASSWORD: abcd
                  E2E_OWNER_USERNAME: owner-e2e
                  E2E_OWNER_PASSWORD: abcd
                  E2E_SUPERVISOR_USERNAME: supervisor-e2e
                  E2E_SUPERVISOR_PASSWORD: abcd
              run: pnpm --prefix src/test/e2e test

            - name: Upload Playwright Report Artifact
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: playwright-report
                  path: src/test/e2e/playwright-report/
                  if-no-files-found: ignore
                  retention-days: 1

    performance-test:
        needs: format
        if: needs.format.outputs.changed != 'true'
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: alfio
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - uses: actions/checkout@v4
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.event.pull_request.head.ref }}

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: 17
                  distribution: temurin

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - uses: pnpm/action-setup@v3
              with:
                  version: 11.1.2

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "pnpm"
                  cache-dependency-path: frontend/pnpm-lock.yaml

            - name: Build Frontend and Backend
              run: |
                  pnpm --prefix frontend install
                  ./gradlew bootJar

            - name: Start alf.io App
              run: |
                  ALFIO_OVERRIDE_SYSTEM_SETTINGS_SYSTEM_API_KEY="my-performance-test-api-key" \
                  ALFIO_OVERRIDE_SYSTEM_SETTINGS_BASE_URL="http://localhost:8080" \
                  java -Ddatasource.url="jdbc:postgresql://localhost:5432/alfio" \
                       -Ddatasource.username="postgres" \
                       -Ddatasource.password="password" \
                       -Dspring.profiles.active=dev \
                       -jar build/libs/alfio-*-boot.jar > app.log 2>&1 &
                  echo "APP_PID=$!" >> $GITHUB_ENV

            - name: Wait for alf.io to start
              run: |
                  MAX_ATTEMPTS=60
                  ATTEMPT=0
                  while true; do
                      if curl --output /dev/null --silent --fail "http://localhost:8080/healthz"; then
                          echo "alf.io is healthy!"
                          break
                      fi
                      ATTEMPT=$((ATTEMPT + 1))
                      if [ ${ATTEMPT} -eq ${MAX_ATTEMPTS} ]; then
                          echo "Error: Timeout waiting for alf.io to start."
                          cat app.log
                          exit 1
                      fi
                      sleep 1
                  done

            - name: Setup k6
              uses: grafana/setup-k6-action@v1

            - name: Run k6 performance test
              uses: grafana/run-k6-action@v1
              with:
                  path: src/test/k6/performance-test.js
                  flags: --env BASE_URL=http://localhost:8080 --env API_KEY=my-performance-test-api-key --env PROFILE=mid-large-event

            - name: Stop alf.io App
              if: always()
              run: |
                  if [ -n "${{ env.APP_PID }}" ]; then
                      kill "${{ env.APP_PID }}" || true
                  fi

            - name: Upload k6 Report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: k6-report
                  path: k6-report.html
                  retention-days: 1

    sonarqube:
        needs: format
        if: needs.format.outputs.changed != 'true'
        runs-on: ubuntu-latest
        services:
            sonarqube:
                image: sonarqube:community
                ports:
                    - 9000:9000
                env:
                    SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
                options: >-
                    --health-cmd "curl -f http://localhost:9000/api/system/status || exit 1"
                    --health-interval 30s
                    --health-timeout 10s
                    --health-retries 20
                    --health-start-period 60s
        steps:
            - uses: actions/checkout@v4
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.event.pull_request.head.ref }}
                  fetch-depth: 0

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: 17
                  distribution: temurin

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Wait for SonarQube to be ready
              run: |
                  echo "Waiting for SonarQube to be ready..."
                  for i in $(seq 1 60); do
                      STATUS=$(curl -s http://localhost:9000/api/system/status | jq -r '.status' 2>/dev/null || echo "DOWN")
                      if [ "$STATUS" = "UP" ]; then
                          echo "SonarQube is ready!"
                          break
                      fi
                      echo "Attempt $i: SonarQube status=$STATUS, waiting..."
                      sleep 5
                  done
                  curl -s http://localhost:9000/api/system/status | jq .

            - name: Create SonarQube project and token
              id: sonar-setup
              run: |
                  # Create a project token
                  TOKEN_RESPONSE=$(curl -s -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate" \
                    -d "name=ci-token" -d "type=USER_TOKEN" -d "projectKey=alfio")
                  SONAR_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.token')
                  echo "sonar_token=${SONAR_TOKEN}" >> "$GITHUB_OUTPUT"

                  # Create the project
                  curl -s -u "${SONAR_TOKEN}:" -X POST "http://localhost:9000/api/projects/create" \
                    -d "name=alf.io" -d "project=alfio" -d "mainBranch=main"

            - name: Run SonarQube Analysis
              env:
                  SONAR_TOKEN: ${{ steps.sonar-setup.outputs.sonar_token }}
                  SONAR_HOST_URL: http://localhost:9000
              run: |
                  ./gradlew build sonar \
                    -Dsonar.host.url=http://localhost:9000 \
                    -Dsonar.token=${{ steps.sonar-setup.outputs.sonar_token }} \
                    -Dsonar.projectKey=alfio

            - name: Generate SonarQube HTML Report
              run: |
                  docker run --rm \
                    --network host \
                    -e SONAR_URL=http://localhost:9000 \
                    -e SONAR_TOKEN=${{ steps.sonar-setup.outputs.sonar_token }} \
                    -e SONAR_PROJECT_KEY=alfio \
                    -e REPORT_FORMATS=html \
                    -v "$(pwd)/reports/sonarqube:/reports" \
                    ghcr.io/a-h-abid/sonarqube-community-reporter:latest --wait
                  sudo chown -R $(id -u):$(id -g) reports/sonarqube
                  mv reports/sonarqube/*.html reports/sonarqube/index.html
                  sed -i 's|<a href="http://localhost:9000/dashboard?id=alfio">Open in SonarQube →</a>||g' reports/sonarqube/index.html

            - name: Upload SonarQube Report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: sonarqube-report
                  path: reports/sonarqube/
                  if-no-files-found: ignore
                  retention-days: 1

    deploy-coverage:
        needs:
            [
                format,
                backend-tests,
                checkstyle,
                frontend-tests,
                e2e-tests,
                performance-test,
                sonarqube,
            ]
        if: needs.format.outputs.changed != 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Prepare Coverage directory structure
              run: |
                  mkdir -p test-results-dashboard/public/reports/backend
                  mkdir -p test-results-dashboard/public/reports/frontend-admin
                  mkdir -p test-results-dashboard/public/reports/frontend-public
                  mkdir -p test-results-dashboard/public/reports/checkstyle
                  mkdir -p test-results-dashboard/public/reports/playwright
                  mkdir -p test-results-dashboard/public/reports/k6
                  mkdir -p test-results-dashboard/public/reports/integration-tests
                  mkdir -p test-results-dashboard/public/reports/api-contract
                  mkdir -p test-results-dashboard/public/reports/sonarqube

            - name: Download Backend Coverage
              uses: actions/download-artifact@v4
              with:
                  name: backend-coverage
                  path: test-results-dashboard/public/reports/backend

            - name: Download Frontend Admin Coverage
              uses: actions/download-artifact@v4
              with:
                  name: frontend-admin-coverage
                  path: test-results-dashboard/public/reports/frontend-admin

            - name: Download Frontend Public Coverage
              uses: actions/download-artifact@v4
              with:
                  name: frontend-public-coverage
                  path: test-results-dashboard/public/reports/frontend-public

            - name: Download Checkstyle Report
              uses: actions/download-artifact@v4
              with:
                  name: checkstyle-report
                  path: test-results-dashboard/public/reports/checkstyle
              continue-on-error: true

            - name: Download Playwright Report
              uses: actions/download-artifact@v4
              with:
                  name: playwright-report
                  path: test-results-dashboard/public/reports/playwright
              continue-on-error: true

            - name: Download k6 Report
              uses: actions/download-artifact@v4
              with:
                  name: k6-report
                  path: test-results-dashboard/public/reports/k6
              continue-on-error: true

            - name: Download JUnit Integration Test Report
              uses: actions/download-artifact@v4
              with:
                  name: integration-test-report
                  path: test-results-dashboard/public/reports/integration-tests
              continue-on-error: true

            - name: Download OpenAPI Contract Report
              uses: actions/download-artifact@v4
              with:
                  name: openapi-contract-report
                  path: test-results-dashboard/public/reports/api-contract
              continue-on-error: true

            - name: Download SonarQube Report
              uses: actions/download-artifact@v4
              with:
                  name: sonarqube-report
                  path: test-results-dashboard/public/reports/sonarqube
              continue-on-error: true

            - name: Generate results.json
              run: |
                  cat <<EOF > test-results-dashboard/src/data/results.json
                  {
                    "title": "PR #${{ github.event.number }}",
                    "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                    "reports": [
                      { "name": "Cobertura Backend (Jacoco)", "path": "reports/backend/index.html", "status": "success" },
                      { "name": "Cobertura Frontend Admin", "path": "reports/frontend-admin/index.html", "status": "success" },
                      { "name": "Cobertura Frontend Publico", "path": "reports/frontend-public/index.html", "status": "success" },
                      { "name": "Checkstyle - Fuentes Principales", "path": "reports/checkstyle/main.html", "status": "success" },
                      { "name": "Checkstyle - Fuentes de Prueba", "path": "reports/checkstyle/test.html", "status": "success" },
                      { "name": "Pruebas E2E con Playwright", "path": "reports/playwright/index.html", "status": "success" },
                      { "name": "Prueba de Rendimiento k6", "path": "reports/k6/k6-report.html", "status": "success" },
                      { "name": "Pruebas de Integracion JUnit", "path": "reports/integration-tests/index.html", "status": "success" },
                      { "name": "Portal de Contrato API (Redoc)", "path": "reports/api-contract/index.html", "status": "success" },
                      { "name": "Reporte de Diferencias API", "path": "reports/api-contract/openapi-diff.html", "status": "success" },
                      { "name": "SonarQube Analysis", "path": "reports/sonarqube/index.html", "status": "success" }
                    ]
                  }
                  EOF

            - uses: pnpm/action-setup@v3
              with:
                  version: 11.1.2

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Build Dashboard
              working-directory: test-results-dashboard
              run: |
                  pnpm install
                  pnpm run build

            - name: Deploy PR Coverage to GitHub Pages
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./test-results-dashboard/dist
                  destination_dir: pr-${{ github.event.number }}
                  keep_files: true

            - name: Comment on PR
              uses: actions/github-script@v7
              with:
                  script: |
                      const repo = context.repo.repo;
                      const owner = context.repo.owner;
                      const prNumber = context.issue.number;
                      const link = `https://${owner}.github.io/${repo}/pr-${prNumber}/`;
                      github.rest.issues.createComment({
                        issue_number: prNumber,
                        owner: owner,
                        repo: repo,
                        body: `Se completó la generación del reporte de cobertura.\n\nEspera 1-2 minutos y revisa los [Reportes de Cobertura](${link})`
                      })
