name: Full Test on Comment

on:
    issue_comment:
        types: [created]

permissions:
    pull-requests: write
    contents: write
    checks: write
    statuses: write

jobs:
    metadata:
        if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/full-test')
        runs-on: ubuntu-latest
        outputs:
            head_sha: ${{ steps.pr_info.outputs.head_sha }}
            head_repo: ${{ steps.pr_info.outputs.head_repo }}
        steps:
            - name: Get PR Info
              id: pr_info
              uses: actions/github-script@v7
              with:
                  script: |
                      const pr = await github.rest.pulls.get({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        pull_number: context.issue.number
                      });
                      core.setOutput('head_sha', pr.data.head.sha);
                      core.setOutput('head_repo', pr.data.head.repo.full_name);

            - name: Add reaction to comment
              uses: actions/github-script@v7
              with:
                  script: |
                      github.rest.reactions.createForIssueComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        comment_id: context.payload.comment.id,
                        content: 'rocket'
                      });

    test:
        needs: metadata
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                postgresql: ["10", "15", "16"]
        steps:
            - name: Create PR Check Run
              id: create_check
              uses: actions/github-script@v7
              with:
                  script: |
                      const check = await github.rest.checks.create({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      name: `Full Test (PostgreSQL ${{ matrix.postgresql }})`,
                      head_sha: '${{ needs.metadata.outputs.head_sha }}',
                      status: 'in_progress',
                      details_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
                      });
                      core.setOutput('check_run_id', check.data.id);

            - uses: actions/checkout@v4
              with:
                  repository: ${{ needs.metadata.outputs.head_repo }}
                  ref: ${{ needs.metadata.outputs.head_sha }}

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: 17
                  distribution: temurin
                  cache: gradle

            - uses: pnpm/action-setup@v3
              if: matrix.postgresql == '16'
              with:
                  version: 11.1.2

            - name: Set up Node.js
              if: matrix.postgresql == '16'
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "pnpm"
                  cache-dependency-path: frontend/pnpm-lock.yaml

            - name: Run Backend Tests
              run: ./gradlew check jacocoTestReport -Dpgsql.version=${{ matrix.postgresql }}

            - name: Run Frontend Tests
              if: matrix.postgresql == '16'
              run: |
                  pnpm --prefix frontend install
                  pnpm --prefix frontend run coverage

            - name: Prepare Coverage for Deployment
              if: matrix.postgresql == '16'
              run: |
                  mkdir -p public-coverage
                  mkdir -p public-coverage/backend
                  mkdir -p public-coverage/frontend-admin
                  mkdir -p public-coverage/frontend-public
                  cp -r build/reports/jacoco/test/html/* public-coverage/backend/
                  cp -r frontend/admin/coverage/* public-coverage/frontend-admin/
                  cp -r frontend/projects/public/coverage/* public-coverage/frontend-public/
                  cat <<EOF > public-coverage/index.html
                  <!DOCTYPE html>
                  <html>
                  <head><title>Coverage Reports - Full Test PR #${{ github.event.issue.number }}</title></head>
                  <body>
                  <h1>Coverage Reports - Full Test PR #${{ github.event.issue.number }}</h1>
                  <ul>
                  <li><a href="backend/index.html">Backend (Jacoco)</a></li>
                  <li><a href="frontend-admin/index.html">Frontend Admin</a></li>
                  <li><a href="frontend-public/index.html">Frontend Public</a></li>
                  </ul>
                  </body>
                  </html>
                  EOF

            - name: Deploy Coverage to GitHub Pages
              if: matrix.postgresql == '16'
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./public-coverage
                  destination_dir: full-test-pr-${{ github.event.issue.number }}
                  keep_files: true

            - name: Update PR Check Run Status
              if: always()
              uses: actions/github-script@v7
              with:
                  script: |
                      const conclusion = '${{ job.status }}' === 'success' ? 'success' : 'failure';
                      const prNumber = context.issue.number;
                      const link = `https://${context.repo.owner}.github.io/${context.repo.repo}/full-test-pr-${prNumber}/`;

                      let summary = `Tests finished with status: ${conclusion}.`;
                      if ('${{ matrix.postgresql }}' === '16' && conclusion === 'success') {
                          summary += `\n\n[View Coverage Report](${link})`;
                      }

                      await github.rest.checks.update({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        check_run_id: ${{ steps.create_check.outputs.check_run_id }},
                        status: 'completed',
                        conclusion: conclusion,
                        output: {
                            title: `Full Test Matrix: PostgreSQL ${{ matrix.postgresql }}`,
                            summary: summary
                        }
                      });
