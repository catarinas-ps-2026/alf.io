services:
    alfio-db:
        image: postgres:10
        container_name: alfio-db
        environment:
            POSTGRES_DB: alfio
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d alfio"]
            interval: 10s
            retries: 5
            start_period: 30s
            timeout: 10s
        ports:
            - 5432:5432
        volumes:
            - data-volume:/var/lib/postgresql/data
volumes:
    data-volume:
