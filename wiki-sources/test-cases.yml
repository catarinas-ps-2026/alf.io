    - title: Flujo Completo de Reserva
      level: "###"
      catalog_header: Escenario
      cases:
          - id: CPF-RES-08
            functionality: Flujo completo de reserva desde selección hasta confirmación
            description: "Valida el flujo completo de reserva de tickets: desde la selección de eventos y llenado de formularios hasta la confirmación y pago, incluyendo todos los caminos posibles del proceso (entradas gratis, múltiples asistentes, temporizador)."
            requirement: RF-RES-08 (Flujo Completo de Reserva)
            preconditions: "Evento público visible con al menos una categoría de tickets configurada y disponibilidad."
            inputs: Cantidad de tickets, datos del comprador/asistente, método de pago, aceptación de términos.
            steps:
                - Acceder al enlace público del evento.
                - Seleccionar categoría y cantidad de tickets.
                - Llenar formulario de comprador/asistente.
                - Aceptar términos y condiciones.
                - Seleccionar método de pago.
                - Confirmar reserva.
                - Verificar página de resultado.
            techniques:
                - Transición de Estados
                - Partición de Equivalencia
                - Tablas de Decisión
            priority: Alta
            analysis:
                equivalency_partitions:
                    - field: Tipo de entrada
                      valid: Gratis (precio = 0)
                      invalid: Con precio (> 0)
                    - field: Cantidad de asistentes
                      valid: 1 entrada
                      invalid: Múltiples entradas (> 1)
                    - field: Método de pago
                      valid: OFFLINE, ON_SITE, Ninguno (gratis)
                      invalid: "-"
                    - field: Estado del countdown
                      valid: Activo (> 0)
                      invalid: Expirado (= 0)
                boundary_values: []
                state_transitions:
                    - image: images/functional-tests/design/reservation-flow.png
                      alt: Diagrama de Transición de Estados - Flujo de Reserva
                    - image: images/functional-tests/design/reservation-cancellation-refund.png
                      alt: Diagrama de Transición de Estados - Cancelación y Reembolso
                decision_tables:
                    - title: Comportamiento según tipo de entrada y método de pago
                      header: Condición
                      columns: [C1, C2, C3, C4, C5, C6]
                      conditions:
                          - name: Tipo de entrada
                            values:
                                [
                                    Gratis,
                                    "Con precio",
                                    "Con precio",
                                    "Con precio",
                                    "Con precio",
                                    "Con precio",
                                ]
                          - name: Método de pago
                            values:
                                [
                                    N/A,
                                    OFFLINE,
                                    OFFLINE,
                                    ON_SITE,
                                    ON_SITE,
                                    Stripe,
                                ]
                          - name: Términos aceptados
                            values: [Sí, Sí, No, Sí, No, Sí]
                      outputs:
                          - name: Redirección
                            values:
                                [
                                    Success,
                                    WaitingPayment,
                                    "No avanza",
                                    Success,
                                    "No avanza",
                                    ProcessingPayment,
                                ]
                          - name: "¿Requiere pago?"
                            values:
                                [
                                    "No",
                                    "Sí (diferido)",
                                    "No",
                                    "Sí (en sitio)",
                                    "No",
                                    "Sí (inmediato)",
                                ]
            catalog:
                - cp_id: CPF-RES-08-001
                  inputs: Reserva con 1 entrada gratuita
                  expected: "Redirige a Success, PEN 0.00, ticket disponible inmediatamente"
                  obs: f+
                - cp_id: CPF-RES-08-002
                  inputs: "Reserva con 1 entrada pagada, método OFFLINE"
                  expected: "Redirige a WaitingPayment, muestra fecha expiración, ID de reserva"
                  obs: f+
                - cp_id: CPF-RES-08-003
                  inputs: "Reserva con 1 entrada pagada, método ON_SITE"
                  expected: 'Redirige a Success, ticket disponible, mensaje "pagar en sitio"'
                  obs: f+
                - cp_id: CPF-RES-08-004
                  inputs: Reserva con múltiples entradas (2)
                  expected: Muestra formulario para 2 asistentes con opción checkbox "Aún no saben quiénes asistirán"
                  obs: f+
                - cp_id: CPF-RES-08-005
                  inputs: Reserva con checkbox "ocultar asistentes" marcado
                  expected: Permite avanzar sin llenar datos de asistentes, campos se completan después
                  obs: f+
                - cp_id: CPF-RES-08-006
                  inputs: Reserva sin aceptar los 3 términos
                  expected: Botón de pago/confirmar deshabilitado, no avanza
                  obs: f-
                - cp_id: CPF-RES-08-007
                  inputs: Countdown expira durante el proceso
                  expected: 'Modal "La sesión ha expirado", redirige al inicio del evento'
                  obs: f-
                - cp_id: CPF-RES-08-008
                  inputs: "Countdown cambia a amarillo (<=5 min)"
                  expected: Timer cambia a color amarillo en la interfaz
                  obs: f+
                - cp_id: CPF-RES-08-009
                  inputs: "Countdown cambia a rojo (<=1 min)"
                  expected: Timer cambia a color rojo en la interfaz
                  obs: f+
                - cp_id: CPF-RES-08-010
                  inputs: Admin confirma pago OFFLINE pendiente
                  expected: Reserva cambia a Completed, tickets se activan
                  obs: f+
                - cp_id: CPF-RES-08-011
                  inputs: Reserva OFFLINE expira antes de confirmación
                  expected: "Reserva cambia a Cancelled, cupo liberado"
                  obs: f+
                - cp_id: CPF-RES-08-012
                  inputs: Admin cancela reserva completada
                  expected: "Reserva cambia a Cancelled, opción de reembolso disponible"
                  obs: f+
                - cp_id: CPF-RES-08-013
                  inputs: Admin ejecuta reembolso
                  expected: "Reserva cambia a Refunded, monto reintegrado"
                  obs: f+
                - cp_id: CPF-RES-08-014
                  inputs: Comprador completa datos de asistentes después
                  expected: Formulario permite edición, datos se guardan correctamente
                  obs: f+
                - cp_id: CPF-RES-08-015
                  inputs: Verificar que ticket PDF contiene código QR
                  expected: PDF generado con código QR válido y datos completos del asistente
                  obs: f+
