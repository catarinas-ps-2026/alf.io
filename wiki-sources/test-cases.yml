    - title: Cálculo de Precios con Descuentos e Impuestos
      level: "###"
      catalog_header: Datos de Entrada
      cases:
          - id: CPF-RES-12
            functionality: Cálculo de precios finales con aplicación de descuentos e impuestos
            description: "Valida que el sistema calcule correctamente el precio final de las entradas considerando: precio base de categoría, descuentos promocionales, impuestos (IVA/VAT), y tarifas de servicio, generando el monto total correcto."
            requirement: RF-RES-12 (Cálculo de Precios)
            preconditions: "Evento con categorías configuradas, promociones activas opcionales."
            inputs: Categoría de ticket, cantidad, código promocional, configuración de impuestos.
            steps:
                - Seleccionar categoría y cantidad de tickets.
                - Ingresar código promocional (si existe).
                - Verificar cálculo en resumen.
                - Confirmar y verificar precio final en pago.
            techniques:
                - Tablas de Decisión
