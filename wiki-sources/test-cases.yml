                      type: Manual
                      status: Exitoso
                      defects: No se encontraron defectos
                      obtained: El dropdown muestra valores predefinidos 0-5, no acepta valores negativos o superiores.
                      evidence:
                          - image: images/functional-tests/run/reservation/21.png
                            alt: select-dropdown-0-5
                            text: Dropdown con rango 0-5 para primera categoría de entradas.
                - cp_id: CPF-RES-01-003
                  inputs: "Dropdown rango 0-10, seleccionar 0"
                  expected: "Dropdown muestra valores 0-10"
                  obs: f+
                  execution:
