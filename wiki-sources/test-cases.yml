            inputs: Fecha/hora de recepción (pre-rellenada), Notas (opcional), Confirmación de eliminación.
            steps:
                - Ingresar a "Pending Payments" del evento.
                - Localizar la reserva pendiente.
                - Hacer clic en "confirm" o "delete".
                - Completar la acción correspondiente.
            techniques:
                - Partición de Equivalencia
                - Transición de Estados
            priority: Alta
            analysis:
                equivalency_partitions:
                    - field: Fecha/hora de recepción
                      valid: Fecha válida (pre-rellenada por el sistema)
                      invalid: "-"
                    - field: Notas
                      valid: Con contenido (texto libre)
                      invalid: "-"
                    - field: Notas
                      valid: Vacío (campo opcional)
                      invalid: "-"
                boundary_values: []
                decision_tables: []
                state_transitions:
                    - alt: Diagrama de Transición de Estados - Gestión de Pagos Pendientes
                      image: images/functional-tests/design/pending-payment-management.png
            catalog:
                - cp_id: CPF-08-001
                  inputs: Confirmar pago con fecha pre-rellenada (notas opcionales)
                  expected: Pago cambia a COMPLETED, reserva desaparece de Pending Payments, contador disminuye
                  obs: f+
                - cp_id: CPF-08-002
                  inputs: Clic en "Cancel" del modal de confirmación
                  expected: Modal se cierra, pago permanece PENDING, reserva permanece en lista
                  obs: f+
                - cp_id: CPF-08-003
                  inputs: Clic en "delete" de reserva pendiente
                  expected: Reserva desaparece de Pending Payments, contador disminuye, cupo se libera
                  obs: f+
                - cp_id: CPF-08-004
                  inputs: Verificar estado tras eliminación
                  expected: Reserva aparece en estado "Cancelled" en la lista de reservas del evento
                  obs: f+
      informe_catalog:
          - cp_id: CPF-08-001
            expected: Pago cambia a COMPLETED, reserva desaparece de Pending Payments, contador disminuye.
            execution:
                description: Verificar que al confirmar un pago pendiente, la reserva cambie a COMPLETED y desaparezca de Pending Payments.
                type: Manual
                status: Exitoso
                defects: No se encontraron defectos
                obtained: La reserva AB8B4C1B fue confirmada exitosamente, desapareció de la lista de pagos pendientes y el contador disminuyó de 2 a 1.
                evidence:
                    - image: images/functional-tests/run/manual-confirm-pending-list.png
                      alt: manual-confirm-pending-list
                      text: Lista de pagos pendientes antes de la confirmación (2 reservas).
                    - image: images/functional-tests/run/manual-confirm-modal-open.png
                      alt: manual-confirm-modal-open
                      text: Modal de confirmación abierto con fecha pre-rellenada y campo de notas.
                    - image: images/functional-tests/run/manual-confirm-after-confirm.png
                      alt: manual-confirm-after-confirm
                      text: Lista de pagos pendientes después de la confirmación (1 reserva), la reserva AB8B4C1B fue removida.
          - cp_id: CPF-08-002
            expected: Modal se cierra, pago permanece PENDING, reserva permanece en lista.
            execution:
