                - Tabla de Decisión
                - Partición de Equivalencia
            priority: Alta
            analysis:
                equivalency_partitions:
                    - field: Aceptación de términos
                      valid: "3 checkboxes marcados"
                      invalid: "0, 1 o 2 checkboxes marcados"
