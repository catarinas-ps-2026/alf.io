design_doc:
    title: Diseño de Casos de Prueba Funcionales del Sistema alf.io
    sections:
        - title: 1. Propósito
          anchor: 1-propósito
          content: |-
              El propósito de este documento es definir y estructurar el diseño de casos de prueba funcionales para el sistema alf.io, con el fin de asegurar la calidad funcional del sistema mediante la aplicación de técnicas de prueba de caja negra.

              Entre los objetivos específicos se incluyen: establecer casos de prueba basados en los requisitos funcionales, aplicar técnicas como partición por equivalencia, análisis de valores límite, pruebas de casos de uso y tablas de decisión y desarrollar una matriz de trazabilidad entre requisitos y pruebas.
        - title: 2. Alcance de las Pruebas
          anchor: 2-alcance-de-las-pruebas
          content: ""
          subsections:
              - title: 2.1 Funcionalidades en Alcance
                content: |-
                    - **Creación y configuración de eventos:** Validar la capacidad de los administradores y organizadores para crear eventos, configurar categorías de tickets, precios y cupos.
                    - **Proceso de reserva y compra de tickets:** Flujo completo desde la selección del ticket por parte del asistente hasta la confirmación de la reserva y generación de la entrada.
                    - **Autenticación y autorización:** Verificación de roles (administrador global, propietario del evento, personal del evento) y control de acceso a las rutas.
                    - **Integración de pagos (Modo Test):** Simulación de pagos exitosos y fallidos utilizando proveedores compatibles (ej. Stripe Test Mode o pagos offline).
              - title: 2.2 Funcionalidades Fuera de Alcance
                content: |-
                    - **Integraciones reales con pasarelas de pago:** Para evitar transacciones financieras reales y costos asociados, todas las pruebas se realizarán en modo de pruebas (sandbox).
                    - **Pruebas de estrés y rendimiento:** El enfoque de este plan es puramente funcional. El rendimiento bajo carga será abordado en una fase o plan de pruebas independiente.
                    - **Generación masiva de facturas PDF:** Solo se probarán las facturas generadas unitariamente durante el flujo normal de reserva.
        - title: 3. Referencias
          anchor: 3-referencias
          content: |-
              1. Estándares de Ingeniería de Software y Pruebas
                 - **ISO/IEC/IEEE 29119:** Estándar internacional para pruebas de software (conceptos, procesos, documentación y técnicas de diseño de pruebas).
              2. Documentación del Proyecto
                 - **Documento de Plan de Pruebas Unitarias:** [[Plan de Pruebas Unitarias]]
                 - **Repositorio oficial de alf.io:** [GitHub - alfio-event/alf.io](https://github.com/alfio-event/alf.io)
                 - **Documentación de Arquitectura de alf.io:** [[Arquitectura]] del proyecto.
        - title: 4. Criterios de Entrada y Salida
          anchor: 4-criterios-de-entrada-y-salida
          content: ""
          subsections:
              - title: 4.1 Criterios de Entrada
                content: |-
                    - El código de la aplicación (alf.io) debe estar compilado y desplegado correctamente en el entorno de pruebas.
                    - Las pruebas unitarias base deben pasar exitosamente en el entorno de CI (GitHub Actions).
                    - La base de datos de pruebas (PostgreSQL) debe estar inicializada con los esquemas actualizados.
              - title: 4.2 Criterios de Salida
                content: |-
                    - Se han ejecutado todos los casos de prueba funcionales diseñados y documentados en la sección de la wiki correspondiente.
                    - Se han reportado todos los defectos encontrados durante la ejecución.
        - title: 5. Entorno y Datos de Prueba
          anchor: 5-entorno-y-datos-de-prueba
          content: ""
          subsections:
              - title: 5.1 Entorno de Pruebas
                content: |-
                    - **Servidor / Hosting:** Entorno remoto de pruebas configurado con Kubernetes, replicando la arquitectura de producción.
                    - **Base de datos:** PostgreSQL en versión 16, compatible con los requerimientos actuales del proyecto, corriendo en un pod aislado.
                    - **Navegadores soportados:** Pruebas funcionales frontend orientadas a las últimas versiones estables de Google Chrome (148.0.7778.215) y Mozilla Firefox (151.0.2).
              - title: 5.2 Datos de Prueba
                content: "- **Cuentas de usuario:** Cuenta de Administrador Global pre-configurada (datos de las variables de entorno de prueba)."
        - title: 6. Técnicas de Prueba
          anchor: 6-técnicas-de-prueba
          content: ""
          subsections:
              - title: 6.1 Técnicas de Caja Negra
                content: |-
                    Se aplicarán las siguientes técnicas de diseño de pruebas basadas en los requisitos funcionales del sistema:

                    - **Partición por equivalencia:** Los datos de entrada se agrupan en clases válidas e inválidas. Por ejemplo, los roles de usuario (administrador, organizador, operador de check-in) se prueban para verificar que cada uno tenga acceso exclusivo a las operaciones permitidas.
                    - **Análisis de valores límite:** Se prueban valores en los extremos de los rangos permitidos, como límites de caracteres en campos de texto, fechas próximas al evento, cupos mínimos y máximos de entradas, y montos de dinero en los límites de precisión de BigDecimal.
                    - **Pruebas de casos de uso:** Se recorren paso a paso los flujos principales del sistema: creación de un evento, configuración de categorías de entradas, proceso de compra, generación de entradas (incluyendo Apple Wallet), check-in y reporting.
                    - **Tablas de decisión:** Se aplican para validar reglas complejas de negocio, como el cálculo de precios con descuentos, impuestos (IVA), tarifas de servicio y promociones combinadas, donde múltiples condiciones booleanas determinan el resultado final.
report_doc:
    title: Informe de Casos de Prueba Funcionales del Sistema alf.io
    sections:
        - title: 1. Introducción
          anchor: 1-introducción
          content: El presente informe documenta la estrategia, ejecución y resultados de las pruebas funcionales realizadas sobre alf.io, un sistema de gestión y venta de entradas para eventos de código abierto. Su propósito es evaluar la calidad del software, identificar defectos potenciales y verificar el cumplimiento de los requisitos del sistema, desde unidades de código hasta flujos completos de usuario.
        - title: 2. Propósito
          anchor: 2-propósito
          content: |-
              Este documento sirve como referencia para:

              - Describir el enfoque de pruebas adoptado y los niveles de cobertura alcanzados.
              - Detallar la configuración del entorno de pruebas.
              - Proporcionar evidencia sobre el comportamiento del sistema en escenarios controlados.
              - Facilitar la reproducibilidad de las pruebas por parte del equipo de desarrollo y QA.
        - title: 3. Alcance
          anchor: 3-alcance
          content: |-
              Las pruebas abarcan los siguiente componentes y funcionalidades de alf.io:

              - **Backend (Java 17, Spring Boot 3.5, Jetty):** Lógica de negocio, repositorios de datos, flujos de reserva, pagos, generación de entradas, gestión de eventos y suscripciones, procesamiento de extensiones JavaScript (Rhino), y migraciones de base de datos.
              - **Frontend público (Angular 17):** Interfaz de compra de entradas, visualización de eventos, formularios de registro.
              - **Frontend de administración (Lit + Shoelace + Vite):** Panel de administración para organizadores de eventos.

              No se incluyen en el alcance las pruebas de infraestructura subyacente, las pruebas de rendimiento ni las integraciones con medios externos en producción.
        - title: 4. Referencias
          anchor: 4-referencias
          content: |-
              - **ISO/IEC/IEEE 29119:** estándar internacional para pruebas de software.
              - **Documentación oficial:** [https://alf.io](https://alf.io)
              - **Repositorio oficial:** [https://github.com/alfio-event/alf.io](https://github.com/alfio-event/alf.io)
        - title: 5. Entorno de pruebas
          anchor: 5-entorno-de-pruebas
          content: ""
          subsections:
              - title: 5.1 Configuración del entorno
                content: |-
                    Las pruebas se ejecutan completamente de manera remota, haciendo uso de una imagen en Github Container Registry que se utilizó para desplegar una misma aplicación para todo el equipo en un cluster de kubernetes en la nube. Esto garantiza que el entorno de pruebas sea idéntico para todos los desarrolladores y que las pruebas sean reproducibles.

                    Este proceso es controlado mediante Github actions, que:
                    - **En cada pull request:** Ejecuta el pipeline de pruebas unitarias, generando reportes de cobertura para el contribuidor.
                    - **En cada push a main:** Ejecuta el pipeline de pruebas unitarias, compila el proyecto y publica la imagen de pruebas en Github Container Registry.
metadata:
    informe:
        7. Limitaciones: |-
            - No se realizan pruebas de carga ni de rendimiento bajo estrés.
            - Las pruebas no cubren la validación de la infraestructura en la nube ni del entorno de producción.
        8. Estrategia y métodos de prueba aplicados: |-
            ### 8.1 Técnicas de diseño de pruebas

            - **Partición por equivalencia:** Los datos de entrada se agrupan en clases válidas e inválidas. Por ejemplo, los roles de usuario (administrador, organizador, operador de check-in) se prueban para verificar que cada uno tenga acceso exclusivo a las operaciones permitidas.
            - **Análisis de valores límite:** Se prueban valores en los extremos de los rangos permitidos, como límites de caracteres en campos de texto, fechas próximas al evento, cupos mínimos y máximos de entradas, y montos de dinero en los límites de precisión de BigDecimal.
            - **Pruebas de casos de uso:** Se recorren paso a paso los flujos principales del sistema: creación de un evento, configuración de categorías de entradas, proceso de compra, generación de entradas (incluyendo Apple Wallet), check-in y reporting.
            - **Tablas de decisión:** Se aplican para validar reglas complejas de negocio, como el cálculo de precios con descuentos, impuestos (IVA), tarifas de servicio y promociones combinadas, donde múltiples condiciones booleanas determinan el resultado final.
        9. Conclusión: El enfoque de pruebas de alf.io combina múltiples niveles con un fuerte énfasis en la automatización para garantizar entornos de prueba reproducibles y fiables. La cobertura es extensa en la capa de negocio y los flujos críticos de pago y reserva, con 141 archivos de prueba que abarcan desde validaciones unitarias hasta escenarios concurrentes complejos. El pipeline de CI verifica cada cambio contra tres versiones de PostgreSQL, asegurando compatibilidad y calidad continua.
test_suites:
    - title: Edición de Tickets Adquiridos (Nombre, Apellido y Correo)
      level: "###"
      catalog_header: Datos de Entrada
      cases:
          - id: CPF-0001
            functionality: Edición de información del asistente post-compra
            description: Permite a un administrador modificar los datos críticos (nombre, apellido y correo) de un ticket que ya ha sido emitido, validando la integridad de los datos.
            requirement: RF-001 (Gestión de Tickets)
            preconditions: "El ticket debe estar en estado 'Purchased'. El usuario debe tener permisos de edición sobre la reserva."
            inputs: Nombre, Apellido, Correo Electrónico.
            steps:
                - Acceder al detalle de la reserva.
                - Hacer clic en la opción de edición del ticket.
                - Modificar los campos de Nombre/Apellido o Correo.
                - Presionar el botón "Guardar".
            techniques:
                - Partición de Equivalencia
                - Análisis de Valores Límite.
            priority: Alta
            analysis:
                equivalency_partitions:
                    - field: Nombre/Apellido
                      valid: Texto alfabético (1-255 caracteres)
                      invalid: "Vacío, > 255 caracteres, incluye números."
                    - field: Correo
                      valid: Formato estándar (user@domain.com)
                      invalid: "Vacío, formato incorrecto (sin @), longitud excesiva."
                boundary_values:
                    - field: Nombre/Apellido
                      min_valid: 1 carácter
                      min_invalid: 0 caracteres (vacío)
                      max_valid: 255 caracteres
                      max_invalid: 256 caracteres
                    - field: Correo
                      min_valid: Longitud mínima válida
                      min_invalid: 0 caracteres
                      max_valid: Máximo soportado (64 chars local)
                      max_invalid: Excede límite (65 chars local)
                decision_tables: []
                state_transitions: []
            catalog:
                - cp_id: CPF-01-001
                  inputs: 'Nombre: "" (vacío)'
                  expected: "Rechazar: Error de campo obligatorio"
                  obs: f-
                  execution:
                      description: Verificar que el campo nombre no admita cadenas vacías.
                      type: Manual
                      status: Exitoso
                      defects: No se encontraron defectos
                      obtained: El sistema no permite guardar y marca el campo.
                      evidence:
                          - image: images/functional-tests/run/ticket-edit-field-len-0.png
                            alt: ticket-edit-field-len-0
                            text: Se muestra que el sistema valida el campo obligatorio.
                - cp_id: CPF-01-002
                  inputs: 'Nombre: "A" (1 carácter)'
                  expected: "Aceptar: Cambio guardado exitosamente"
                  obs: f+
                  execution:
                      description: Verificar que el campo nombre admita 1 carácter.
                      type: Manual
                      status: Exitoso
                      defects: No se encontraron defectos
                      obtained: Cambio guardado exitosamente
                      evidence:
                          - image: images/functional-tests/run/ticket-edit-field-len-1.png
                            alt: ticket-edit-field-len-1
                            text: Se muestra la edición exitosa con un solo carácter.
                - cp_id: CPF-01-003
                  inputs: "Nombre: (Cadena de 254 caracteres)"
                  expected: "Aceptar: Cambio guardado exitosamente"
                  obs: f+
                  execution:
                      description: Verificar que el campo nombre admita 254 caracteres.
                      type: Manual
                      status: Fallido
                      defects: "500 Unexpected Exception"
                      obtained: Error 500 del servidor al intentar procesar la solicitud.
                      evidence:
                          - image: images/functional-tests/run/ticket-edit-field-len-254.png
                            alt: ticket-edit-field-len-254
                            text: Se observa una excepción inesperada al usar cadenas largas.
                - cp_id: CPF-01-004
                  inputs: "Nombre: (Cadena de 255 caracteres)"
                  expected: "Aceptar: Cambio guardado exitosamente"
                  obs: f+
                  execution:
                      description: Verificar que el campo nombre admita 255 caracteres.
                      type: Manual
                      status: Fallido
                      defects: "500 Unexpected Exception"
                      obtained: Error 500 del servidor al intentar procesar la solicitud.
                      evidence:
                          - image: images/functional-tests/run/ticket-edit-field-len-255.png
                            alt: ticket-edit-field-len-255
                            text: El sistema falla con error 500 en el límite superior de la base de datos.
                - cp_id: CPF-01-005
                  inputs: "Nombre: (Cadena de 256 caracteres)"
                  expected: "Rechazar: Error de longitud excedida"
                  obs: f-
                  execution:
                      description: Verificar que el campo nombre rechace 256 caracteres.
                      type: Manual
                      status: Exitoso
                      defects: No se encontraron defectos
                      obtained: El sistema bloquea la entrada o rechaza por validación de frontend.
                      evidence:
                          - image: images/functional-tests/run/ticket-edit-field-len-256.png
                            alt: ticket-edit-field-len-256
                            text: El sistema rechaza correctamente la longitud excedida.
                - cp_id: CPF-01-006
                  inputs: 'Nombre: "Juan123" (con números)'
                  expected: "Rechazar: Error de formato (solo letras)"
                  obs: f-
                  execution:
                      description: Verificar que el campo nombre no admita números.
                      type: Manual
                      status: Fallido
                      defects: El sistema acepta caracteres numéricos.
                      obtained: El sistema acepta y guarda el nombre con números.
                      evidence:
                          - image: images/functional-tests/run/ticket-edit-field-numbers.png
                            alt: ticket-edit-field-numbers
                            text: Se observa que el sistema no valida el tipo de dato alfanumérico.
                - cp_id: CPF-01-007
                  inputs: 'Correo: "" (vacío)'
                  expected: "Rechazar: Error de campo obligatorio"
                  obs: f-
                  execution:
                      description: Verificar que el campo correo no admita cadenas vacías.
                      type: Manual
                      status: Exitoso
                      defects: No se encontraron defectos
                      obtained: El sistema impide el guardado sin correo.
                      evidence:
                          - image: images/functional-tests/run/ticket-edit-email-len-0.png
                            alt: ticket-edit-email-len-0
                            text: Validación de correo obligatorio exitosa.
                - cp_id: CPF-01-008
                  inputs: 'Correo: "aaaaa" (sin formato @)'
                  expected: "Rechazar: Error de formato de correo"
                  obs: f-
                  execution:
                      description: Verificar que el campo correo rechace formatos inválidos (sin @).
                      type: Manual
                      status: Exitoso
                      defects: No se encontraron defectos
                      obtained: Rechazo por formato inválido.
                      evidence:
                          - image: images/functional-tests/run/ticket-edit-email-invalid.png
                            alt: ticket-edit-email-invalid
                            text: El sistema detecta correctamente el formato de correo inválido.
                - cp_id: CPF-01-009
                  inputs: Correo con longitud de 63 caracteres
                  expected: "Aceptar: Cambio guardado exitosamente"
                  obs: f+
                  execution:
                      description: Verificar correo con longitud de 63 caracteres.
                      type: Manual
                      status: Exitoso
                      defects: No se encontraron defectos
                      obtained: Cambio guardado exitosamente.
                      evidence:
                          - image: images/functional-tests/run/ticket-edit-email-len-63.png
                            alt: ticket-edit-email-len-63
                            text: Prueba positiva de longitud de correo exitosa.
                - cp_id: CPF-01-010
                  inputs: Correo con longitud de 64 caracteres
                  expected: "Aceptar: Cambio guardado exitosamente"
                  obs: f+
                  execution:
                      description: Verificar correo con longitud de 64 caracteres.
                      type: Manual
                      status: Exitoso
                      defects: No se encontraron defectos
                      obtained: Cambio guardado exitosamente.
                      evidence:
                          - image: images/functional-tests/run/ticket-edit-email-len-64.png
                            alt: ticket-edit-email-len-64
                            text: Prueba positiva en el límite de 64 caracteres exitosa.
                - cp_id: CPF-01-011
                  inputs: Correo con longitud de 65 caracteres
                  expected: "Rechazar: Error de longitud excedida"
                  obs: f-
                  execution:
                      description: Verificar que el campo correo rechace 65 caracteres.
                      type: Manual
                      status: Fallido
                      defects: "El sistema acepta correos de más de 64 caracteres."
                      obtained: El sistema permite guardar el correo de 65 caracteres.
                      evidence:
                          - image: images/functional-tests/run/ticket-edit-email-len-65.png
                            alt: ticket-edit-email-len-65
                            text: Se muestra que el sistema no aplica la restricción de longitud en el correo.
    - title: Búsqueda de Reservas (Panel de Administración)
      level: "###"
      catalog_header: Criterio de Búsqueda
      cases:
          - id: CPF-0002
            functionality: Búsqueda y filtrado de reservas
            description: Valida que el sistema de búsqueda administrativa recupere correctamente las reservas basándose en el ID único o el apellido del asistente.
            requirement: RF-002 (Búsqueda de Reservas)
            preconditions: Deben existir reservas previas en el sistema.
            inputs: ID de reserva, Apellido.
            steps:
                - Ingresar al listado de reservas.
                - Introducir el criterio en la barra de búsqueda.
                - Ejecutar la búsqueda.
            techniques:
                - Partición de Equivalencia.
            priority: Media
            analysis:
                equivalency_partitions:
                    - field: PE-B01
                      valid: ID de reserva existente en el sistema
                      invalid: ID inexistente o mal formado
                    - field: PE-B02
                      valid: Apellido exacto de un comprador
                      invalid: Apellido que no figura en ninguna reserva
                boundary_values: []
                decision_tables: []
                state_transitions: []
            catalog:
                - cp_id: CPF-02-001
                  inputs: 'ID: "ID-EXISTENTE"'
                  expected: El sistema muestra la reserva específica
                  obs: f+
                  execution:
                      description: Búsqueda por ID de reserva existente.
                      type: Manual
                      status: Exitoso
                      defects: No se encontraron defectos
                      obtained: Se muestra la reserva correspondiente al ID.
                      evidence:
                          - image: images/functional-tests/run/reserve-search-id.png
                            alt: reserve-search-id
                            text: Búsqueda exitosa por identificador único.
                - cp_id: CPF-02-002
                  inputs: 'Apellido: "Pérez"'
                  expected: El sistema lista todas las reservas bajo ese apellido
                  obs: f+
                  execution:
                      description: Búsqueda por apellido de asistente.
                      type: Manual
                      status: Exitoso
                      defects: No se encontraron defectos
                      obtained: Resultados filtrados correctamente por apellido.
                      evidence:
                          - image: images/functional-tests/run/reserve-search-lastname.png
                            alt: reserve-search-lastname
                            text: Búsqueda por criterio de texto exitosa.
                - cp_id: CPF-02-003
                  inputs: 'Valor: "ValorInexistente"'
                  expected: El sistema muestra mensaje "Sin resultados"
                  obs: f-
                  execution:
                      description: Búsqueda de valor inexistente.
                      type: Manual
                      status: Exitoso
                      defects: No se encontraron defectos
                      obtained: Mensaje de "No results found" mostrado correctamente.
                      evidence:
                          - image: images/functional-tests/run/reserve-search-none.png
                            alt: reserve-search-none
                            text: Comportamiento esperado ante búsqueda sin coincidencias.
    - title: Gestión de Estados de Reserva y Pagos
      level: "###"
      catalog_header: "Acción / Escenario"
      cases:
          - id: CPF-0003
            functionality: Transiciones de estado por pagos manuales
            description: Verifica que las reservas transicionen correctamente entre estados tras acciones manuales (aceptar/cancelar pago) y que la UI responda a las reglas de negocio.
            requirement: RF-003 (Gestión de Estados)
            preconditions: Reserva en estado pendiente de pago.
            inputs: Interacción con botones de acción y modales.
            steps:
                - Seleccionar una reserva pendiente.
                - Ejecutar acción de pago/cancelación.
                - Validar cambio de estado en la tabla.
            techniques:
                - Transición de Estados
                - Tablas de Decisión.
            priority: Alta
            analysis:
                equivalency_partitions: []
                boundary_values: []
                decision_tables:
                    - title: 'Visibilidad del botón "Marcar como Completa"'
                      header: Condición
                      columns: [C1, C2, C3, C4]
                      conditions:
                          - name: "¿Se completó el llenado?"
                            values: [SI, SI, SI, "NO"]
                          - name: Tipo de Pago
                            values: [Presencial, Offline, Proveedor, "-"]
                          - name: "¿Pago Aprobado?"
                            values: ["NO", SI, "NO", "NO"]
                      action_name: Mostrar Botón
                      actions: ["NO", SI, "NO", "NO"]
                state_transitions:
                    - alt: Diagrama de Transición de Estados
                      image: images/functional-tests/design/gestion-estados.png
            catalog:
                - cp_id: CPF-03-001
                  inputs: 'Clic en "Aceptar Pago" -> Confirmar'
                  expected: La reserva cambia a estado COMPLETE
                  obs: f+
                  execution:
                      description: Transición de PENDING a COMPLETE tras aceptar pago.
                      type: Manual
                      status: Exitoso
                      defects: No se encontraron defectos
                      obtained: Cambio de estado reflejado correctamente en la tabla.
                      evidence:
                          - image: images/functional-tests/run/reservation-approve-payment-1.png
                            alt: approve-1
                            text: ""
                          - image: images/functional-tests/run/reservation-approve-payment-2.png
                            alt: approve-2
                            text: ""
                          - image: images/functional-tests/run/reservation-approve-payment-3.png
                            alt: approve-3
                            text: Flujo completo de aprobación de pago.
                - cp_id: CPF-03-002
                  inputs: 'Clic en "Cancelar Pago" -> Confirmar'
                  expected: La reserva cambia a estado CANCELLED
                  obs: f+
                  execution:
                      description: Transición de PENDING a CANCELLED tras cancelar pago.
                      type: Manual
                      status: Exitoso
                      defects: No se encontraron defectos
                      obtained: Cambio de estado reflejado correctamente en la tabla.
                      evidence:
                          - image: images/functional-tests/run/reservation-cancel-1.png
                            alt: cancel-1
                            text: ""
                          - image: images/functional-tests/run/reservation-cancel-2.png
                            alt: cancel-2
                            text: ""
                          - image: images/functional-tests/run/reservation-cancel-3.png
                            alt: cancel-3
                            text: Flujo completo de cancelación de reserva.
                - cp_id: CPF-03-003
                  inputs: Iniciar transición -> Clic fuera del modal
                  expected: El modal se cierra y el estado se mantiene
