    - title: "Creación de Tickets"
      level: "###"
      catalog_header: "Datos de Entrada"
      cases:
          - id: CPF-MAN-04
            functionality: Creación de tickets
            description: "Permite configurar los tickets de un evento, definiendo el modelo de precio, cantidad máxima disponible, precio, impuestos y métodos de pago aceptados."
            requirement: RF-MAN-04 (Creación de tickets)
            preconditions: "El usuario debe estar autenticado con permisos de administración y debe existir un evento previamente creado."
            inputs: "Modelo de precio del ticket, cantidad máxima de tickets, precio regular, moneda, porcentaje de impuestos y métodos de pago aceptados."
            steps:
                - "Acceder a la configuración de tickets del evento."
                - "Seleccionar el modelo de precio."
                - "Completar los datos de capacidad y precio."
                - "Configurar impuestos."
                - "Seleccionar los métodos de pago aceptados."
                - 'Presionar "Save".'
            techniques:
                - Partición por Equivalencia
                - Análisis de Valores Límite
                - Tabla de Decisión
            priority: Alta
            analysis:
                equivalency_partitions:
                    - field: Ticket Price Model
                      valid: "Entry fee requested, Free of charge"
                      invalid: Vacío
                    - field: Max Tickets
                      valid: Número entero positivo
                      invalid: "Vacío, cero, negativo"
                    - field: Regular Price
                      valid: Número mayor o igual a 0
                      invalid: "Negativo, vacío"
                    - field: Currency
                      valid: Moneda válida del sistema
                      invalid: "Vacía, inexistente"
                    - field: "Taxes (%)"
                      valid: "Valor entre 0 y 100"
                      invalid: "Negativo, mayor a 100"
                    - field: Accepted Payment Methods
                      valid: Al menos un método seleccionado
                      invalid: Ningún método seleccionado
                    - field: Price Includes Taxes
                      valid: "Activado o desactivado"
                      invalid: N/A
                boundary_values:
                    - field: Max Tickets
                      min_valid: 1
                      min_invalid: 0
                      max_valid: 999999
                      max_invalid: 1000000
                    - field: Regular Price
                      min_valid: 0.00
                      min_invalid: -0.01
                      max_valid: Valor máximo soportado
                      max_invalid: Excede límite
                    - field: "Taxes (%)"
                      min_valid: 0
                      min_invalid: -1
                      max_valid: 100
                      max_invalid: 101
                    - field: Payment Methods
                      min_valid: 1 método
                      min_invalid: 0 métodos
                      max_valid: Todos los métodos disponibles
                      max_invalid: N/A
                decision_tables:
                    - title: Validación de Campos Obligatorios para la Creación de Tickets
                      raw: |-
                        | Condición                     | C1     | C2     | C3     | C4     | C5     | C6     |
                        | :---------------------------- | :----- | :----- | :----- | :----- | :----- | :----- |
                        | Modelo de precio seleccionado | SI     | NO     | SI     | SI     | SI     | SI     |
                        | Max Tickets informado         | SI     | SI     | NO     | SI     | SI     | SI     |
                        | Moneda informada              | SI     | SI     | SI     | NO     | SI     | SI     |
                        | Método de pago seleccionado   | SI     | SI     | SI     | SI     | NO     | SI     |
                        | Precio válido (*)             | SI     | SI     | SI     | SI     | SI     | NO     |
                        | **Crear Ticket**              | **SI** | **NO** | **NO** | **NO** | **NO** | **NO** |

                        (*) Para el modelo "Free of charge", el precio debe ser igual a 0.
                    - title: Acciones
                      raw: |-
                        | Acción                      | C1 | C2 | C3 | C4 | C5 | C6 |
                        | :-------------------------- | :- | :- | :- | :- | :- | :- |
                        | Permitir guardar ticket     | X  |    |    |    |    |    |
                        | Mostrar error de validación |    | X  | X  | X  | X  | X  |
                state_transitions: []
            catalog:
