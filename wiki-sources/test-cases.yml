            preconditions: "Flujo de reserva en paso de términos y condiciones."
            inputs: "Estado de los 3 checkboxes de aceptación."
            steps:
                - "Avanzar al paso de términos y condiciones."
                - "Verificar que el botón está deshabilitado sin aceptar."
