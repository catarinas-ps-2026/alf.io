                      min_valid: ">= 0"
                      min_invalid: Negativo
                      max_valid: "-"
                      max_invalid: "-"
                decision_tables:
                    - title: Cálculo de precio con descuentos e impuestos
                      header: Condición
                      columns: [C1, C2, C3, C4, C5, C6, C7, C8]
                      conditions:
                          - name: Precio base
                            values:
