    - title: "Selección de Entradas (Tickets)"
      level: "###"
      catalog_header: "Datos de Entrada"
      cases:
          - id: CPF-RES-01
            functionality: Selección y validación de cantidad de entradas
            description: "Valida que el sistema controle la selección de entradas: cantidad mínima (no avanzar con 0), rangos de dropdown predefinidos (0-5 y 0-10), y disponibilidad de inventario (insuficiente y sold out)."
            requirement: RF-RES-01 (Selección de Entradas)
            preconditions: "Evento público visible con al menos una categoría de tickets configurada."
            inputs: "Cantidad de entradas (dropdown o campo numérico), categoría de ticket."
            steps:
                - "Acceder a la página pública del evento."
                - "Intentar continuar con 0 entradas."
                - "Seleccionar cantidades en dropdown (rangos 0-5 y 0-10)."
                - "Intentar seleccionar más entradas de las disponibles."
            techniques:
                - Partición de Equivalencia
                - Análisis de Valores Límite
            priority: Alta
            analysis:
                equivalency_partitions:
                    - field: Cantidad de tickets
                      valid: "1-5 o 1-10 (según categoría)"
                      invalid: "0 entradas"
                    - field: Rango 0-5
                      valid: "0, 1, 2, 3, 4, 5"
                      invalid: "Negativos, >5"
                    - field: Rango 0-10
                      valid: "0, 1, 2, ..., 10"
                      invalid: "Negativos, >10"
                    - field: Disponibilidad
                      valid: "Tickets > 0"
                      invalid: "Tickets = 0 (sold out)"
                    - field: Solicitud
                      valid: "Cantidad <= disponibles"
                      invalid: "Cantidad > disponibles"
                boundary_values:
                    - field: Cantidad
                      min_valid: 1
                      min_invalid: 0
                      max_valid: 5 o 10
                      max_invalid: 6 o 11
                decision_tables: []
                state_transitions: []
            catalog:
                - cp_id: CPF-RES-01-001
                  inputs: "Cantidad: 0"
                  expected: "Error: seleccione al menos una entrada, no avanza"
                  obs: f-
                  execution:
                      description: Verificar que no se permita avanzar con 0 entradas seleccionadas.
                      type: Manual
                      status: Exitoso
                      defects: No se encontraron defectos
                      obtained: El sistema muestra el mensaje de error y no permite avanzar.
                      evidence:
                          - image: images/functional-tests/run/reservation/11.png
                            alt: select-0-entries
                            text: Se muestra el mensaje de error al intentar continuar con 0 entradas.
                - cp_id: CPF-RES-01-002
                  inputs: "Dropdown rango 0-5, seleccionar 0"
                  expected: "Dropdown muestra valores 0-5"
                  obs: f+
                  execution:
