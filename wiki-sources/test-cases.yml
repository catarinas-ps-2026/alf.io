    - title: Gestión de Pagos Pendientes (Administrador)
      level: "###"
      catalog_header: "Datos de Entrada"
      cases:
          - id: CPF-0008
            functionality: Gestión de pagos pendientes por parte del administrador (confirmación y eliminación)
            description: Valida que el administrador pueda confirmar pagos OFFLINE pendientes mediante un modal, cancelar la operación manteniendo el estado pendiente, y eliminar reservas pendientes liberando el cupo del evento.
            requirement: RF-008 (Gestión de Pagos Pendientes)
