                      invalid: Inválido, expirado, ya utilizado
                    - field: Descuento
                      valid: "Valor entre 0% y 100%"
                      invalid: "< 0%, > 100%"
                    - field: Impuesto
                      valid: Tasas estándar (0%, 18%, etc.)
                      invalid: Tasas negativas
                boundary_values:
                    - field: Descuento (%)
                      min_valid: 0%
                      min_invalid: -1%
                      max_valid: 100%
                      max_invalid: 101%
